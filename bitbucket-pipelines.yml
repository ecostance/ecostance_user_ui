#bitbucket-pipelines.yml
image: node:16.14.2

pipelines:
  branches:
   master:
       - step:
           size: 2x
           name: Build React Project
           caches:
             - node
           script:
             - echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env
             - echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" >> .env
             - echo "API_BASE=$API_BASE" >> .env
             - npm install --force
             - CI=false npx next build
             - mkdir packaged
             - tar -czvf packaged/package-${BITBUCKET_BUILD_NUMBER}.tar.gz -C .next .
           artifacts:
             - packaged/**
       - step:
           name: Deploy to Web
           image: alpine
           deployment: production
           script:
             - mkdir upload
             - tar -xf packaged/package-${BITBUCKET_BUILD_NUMBER}.tar.gz -C upload
             - apk update && apk add openssh rsync
             - rsync -zrSlh --stats upload/ $USERNAME@$SERVER:ecostance.com
             - ssh  $USERNAME@$SERVER "./ecostance.com.sh"